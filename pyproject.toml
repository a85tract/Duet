[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duet-decoder"
version = "0.1.0"
description = "Duet: neural decoding of logical Clifford circuits with transversal gates (code and data release)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "stim==1.16.0",
    "pymatching==2.4.0",
    "lomatching==0.3.0",
    "ldpc==2.4.1",
    "tesseract-decoder==0.1.1.dev20260822020007",
    "torch==2.11.0",
    "triton==3.6.0; sys_platform == 'linux'",
    "pyscipopt==6.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
paper = ["matplotlib==3.11.2"]

[tool.setuptools]
packages = ["duet", "duet.net", "duet.decoders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
